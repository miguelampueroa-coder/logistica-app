name: Tests & Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/backend
          npm install

      - name: TypeScript check
        run: |
          cd apps/backend
          npm run typecheck

      - name: Run tests
        run: |
          cd apps/backend
          npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/web-client
          npm install

      - name: TypeScript check
        run: |
          cd apps/web-client
          npm run typecheck

      - name: Build
        run: |
          cd apps/web-client
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-client-build
          path: apps/web-client/.next

  mobile-typecheck:
    name: Mobile TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/mobile-provider
          npm install

      - name: TypeScript check
        run: |
          cd apps/mobile-provider
          npm run typecheck
